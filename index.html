<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>爬山趣 · 记录每一次登顶</title>
  <meta name="description" content="爬山趣 —— 发现名山、记录登顶、收集成就的徒步登山小站">
  <meta name="theme-color" content="#123527">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%B0%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <main id="page" class="page"></main>

    <nav class="tabbar" id="tabbar">
      <a href="#/home" class="tab" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.5l8.5 7.3"/><path d="M5.5 9.5v11h13v-11"/></svg>
        <span>首页</span>
      </a>
      <a href="#/explore" class="tab" data-tab="explore">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M15.8 8.2l-2.1 5.5-5.5 2.1 2.1-5.5z"/></svg>
        <span>发现</span>
      </a>
      <button class="fab" data-action="checkin" title="登顶打卡" aria-label="登顶打卡">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <a href="#/records" class="tab" data-tab="records">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>记录</span>
      </a>
      <a href="#/profile" class="tab" data-tab="profile">
        <svg viewBox="0 0 24 24"><path d="M20 21v-1.5a4.5 4.5 0 0 0-4.5-4.5h-7A4.5 4.5 0 0 0 4 19.5V21"/><circle cx="12" cy="7.5" r="4"/></svg>
        <span>我的</span>
      </a>
    </nav>
    <button class="chat-fab" id="chat-fab" data-action="open-chat" aria-label="和山灵聊聊">
      <span aria-hidden="true">🏔️</span><small>山灵</small>
    </button>
  </div>

  <div id="modal-root"></div>
  <div id="chat-root"></div>
  <div id="confetti-root"></div>
  <div id="toast-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
